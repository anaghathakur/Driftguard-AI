name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend and development dependencies
        run: python -m pip install -e "./apps/api[dev]"

      - name: Run Ruff
        run: python -m ruff check --config apps/api/pyproject.toml apps/api

      - name: Run complete backend test suite
        run: python -m pytest -c apps/api/pyproject.toml apps/api/tests

  frontend:
    name: Frontend · Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend route tests
        run: npm test

      - name: Build production frontend
        run: npm run build

  infrastructure:
    name: Infrastructure · Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without a state backend
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

  containers:
    name: Containers · Build only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag driftguard-api:ci .

      - name: Build frontend image
        run: >-
          docker build --file apps/web/Dockerfile --tag driftguard-web:ci
          --build-arg VITE_API_BASE_URL=https://api.invalid .
